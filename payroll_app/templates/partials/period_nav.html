<style>
.np-period-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.np-period-nav .np-pn-label{flex:1 1 180px;min-width:150px;text-align:center;line-height:1.25}
.np-period-nav .np-pn-label b{display:block;font-size:16px;color:#1f2937}
.np-period-nav .np-pn-label span{font-size:12px;color:#6b7280}
.np-period-nav .btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.np-period-nav .np-pn-off{opacity:.45;pointer-events:none;cursor:default}
@media (max-width:560px){.np-period-nav{display:grid;grid-template-columns:1fr 1fr}.np-period-nav .np-pn-label{grid-column:1 / -1;order:-1}.np-period-nav .np-pn-today{grid-column:1 / -1}}
</style>
<nav class="np-period-nav" aria-label="{{ aria }}">
  {% if prev_disabled %}<span class="btn btn-outline np-pn-off" aria-disabled="true">&laquo; {{ prev_label }}</span>{% else %}<a class="btn btn-outline" href="{{ prev_url }}">&laquo; {{ prev_label }}</a>{% endif %}
  <div class="np-pn-label"><b>{{ label }}</b>{% if sublabel %}<span>{{ sublabel }}</span>{% endif %}</div>
  {% if next_disabled %}<span class="btn btn-outline np-pn-off" aria-disabled="true">{{ next_label }} &raquo;</span>{% else %}<a class="btn btn-outline" href="{{ next_url }}">{{ next_label }} &raquo;</a>{% endif %}
  {% if not today_active %}<a class="btn btn-outline np-pn-today" href="{{ today_url }}">{{ today_label }}</a>{% endif %}
</nav>
