{% if items %}<style>
.sb-ann{margin:6px 12px 10px;padding:10px 10px 8px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.04);}
.sb-ann-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8da0b8;margin:0 4px 6px;}
.sidebar .sb-ann a.sb-ann-i{display:flex;gap:8px;align-items:flex-start;padding:6px 4px;border-left:0;font-size:12.5px;line-height:1.3;color:#e2e8f0;}
.sb-ann .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:#22c55e;}
.sb-ann .p-urgent .dot{background:#ef4444;}.sb-ann .p-high .dot{background:#f59e0b;}.sb-ann .p-low .dot{background:#94a3b8;}
.sb-ann .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.sb-ann .tx small{color:#8da0b8;font-size:11px;}
.sb-ann .unread .tx b::after{content:" \2022";color:#5b8cff;}
.sidebar .sb-ann a.sb-ann-all{display:block;padding:4px;font-size:11.5px;color:#8da0b8;}
body.sb-collapsed .sb-ann{display:none;}
</style>
<div class="sb-ann" id="sbAnnouncements" aria-label="Announcements"><div class="sb-ann-h">Announcements</div>
{% for a in items %}<a class="sb-ann-i p-{{ a.priority|lower }}{% if a.unread %} unread{% endif %}" href="{{ url }}" title="{{ a.title }}"><span class="dot"></span><span class="tx"><b>{{ a.title }}</b><small>{{ a.get_priority_display }} &middot; {{ a.publish_date|date:"d M" }}</small></span></a>{% endfor %}
{% if total > items|length %}<a class="sb-ann-all" href="{{ url }}">View all {{ total }}</a>{% else %}<a class="sb-ann-all" href="{{ url }}">Open announcements</a>{% endif %}</div>{% endif %}
