{% extends "public_base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<p class="sub">Enter your account email and we'll send reset instructions.</p>
<form method="post" novalidate>
  {% csrf_token %}
  <div class="field">{{ form.email.label_tag }}{{ form.email }}{{ form.email.errors }}</div>
  <button class="btn" type="submit">Send reset link</button>
</form>
<div class="links"><a href="{% url 'login' %}">&larr; Back to sign in</a></div>
{% endblock %}
