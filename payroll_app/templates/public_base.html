<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}EdgePro Payroll{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f172a; --ink:#0f172a; --body:#334155; --muted:#64748b;
    --paper:#f4f6f9; --card:#ffffff; --line:#e6e9f0;
    --accent:#4f46e5; --accent-dark:#4338ca; --accent-soft:#eef0fe;
    --success:#0f9d6a; --success-soft:#e5f8f1; --danger:#dc2626; --danger-soft:#fdeceb;
    --radius:12px; --shadow:0 4px 20px rgba(15,23,42,.08);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',Arial,sans-serif; background:var(--paper); color:var(--body); min-height:100vh; display:flex; flex-direction:column; }
  .topbar{ padding:18px 32px; font-weight:800; color:var(--ink); font-size:16px; }
  .topbar a{ color:inherit; text-decoration:none; }
  .wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .box{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:32px; width:100%; max-width:440px; }
  .box.wide{ max-width:620px; }
  h1{ font-size:19px; font-weight:800; margin:0 0 4px; color:var(--ink); }
  p.sub{ font-size:13px; color:var(--muted); margin:0 0 22px; }
  label{ display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .field{ margin-bottom:14px; }
  input[type=text], input[type=email], input[type=password], input[type=tel], textarea, select{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13px;
  }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:600; font-size:13px; padding:10px 16px; border-radius:8px; border:none; cursor:pointer; width:100%; background:var(--accent); color:#fff; }
  .btn:hover{ background:var(--accent-dark); }
  .links{ text-align:center; margin-top:14px; font-size:12.5px; }
  .links a{ color:var(--accent); text-decoration:none; }
  ul.errorlist{ list-style:none; margin:4px 0 0; padding:0; color:var(--danger); font-size:11.5px; }
  .alert{ padding:12px 16px; border-radius:9px; font-size:13px; margin-bottom:16px; }
  .alert-success{ background:var(--success-soft); color:var(--success); }
  .alert-error{ background:var(--danger-soft); color:var(--danger); }
  .alert-info{ background:var(--accent-soft); color:var(--accent-dark); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
  @media (max-width:520px){ .form-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="topbar"><a href="{% url 'landing' %}">EdgePro Payroll</a></div>
  <div class="wrap">
    <div class="box {% block boxsize %}{% endblock %}">
      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-error{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
