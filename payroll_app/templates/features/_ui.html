<style>
  .fx{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0f172a}
  .fx h1{font-size:22px;font-weight:800;margin:0 0 4px}
  .fx .muted{color:#64748b;font-size:13.5px}
  .fx-card{background:#fff;border:1px solid #e6e8ef;border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .fx-card h2{font-size:16px;font-weight:800;margin:0 0 12px}
  .fx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .fx-grid .full{grid-column:1/-1}
  .fx label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
  .fx input,.fx select,.fx textarea{width:100%;box-sizing:border-box;min-height:38px;padding:7px 10px;border:1px solid #dfe3ea;border-radius:6px;font:inherit;font-size:14px}
  .fx .errorlist{list-style:none;color:#dc2626;font-size:12.5px;margin:4px 0 0;padding:0}
  .fx .help{font-size:11.5px;color:#94a3b8;margin-top:3px}
  .fx-btn{display:inline-block;border:none;border-radius:6px;background:#179042;color:#fff!important;font-weight:700;font-size:13.5px;padding:9px 16px;cursor:pointer;text-decoration:none}
  .fx-btn.ghost{background:#fff;color:#179042!important;border:1px solid #179042}
  .fx-btn.danger{background:#fff;color:#dc2626!important;border:1px solid #fecaca}
  .fx-table{overflow-x:auto}
  .fx table{width:100%;border-collapse:collapse;font-size:14px}
  .fx th{text-align:left;font-size:11.5px;text-transform:uppercase;color:#64748b;padding:8px 6px;border-bottom:1px solid #e6e8ef;white-space:nowrap}
  .fx td{padding:9px 6px;border-bottom:1px solid #f1f3f7;vertical-align:top}
  .fx-tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#f0fbf4;color:#18502c}
  .fx-tag.OPEN,.fx-tag.PENDING,.fx-tag.ACTIVE,.fx-tag.PUBLISHED{background:#fff6e5;color:#b45309}
  .fx-tag.RESOLVED,.fx-tag.CLOSED,.fx-tag.CONVERTED,.fx-tag.APPROVED{background:#dcfce7;color:#166534}
  .fx-tag.REJECTED,.fx-tag.INACTIVE,.fx-tag.ARCHIVED,.fx-tag.CANCELLED{background:#fee2e2;color:#b91c1c}
  .fx-tl{border-left:3px solid #e6e8ef;padding-left:14px}
  .fx-tl div{margin-bottom:12px}
  .fx-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .fx-filters input,.fx-filters select{width:auto;min-width:160px}
  @media (max-width:800px){.fx-grid{grid-template-columns:1fr}}
</style>
