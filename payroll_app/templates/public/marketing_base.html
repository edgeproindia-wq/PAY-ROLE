<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}EDGEPRO Payroll{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f172a; --card-dark:#1c2742; --accent:#6366f1; --accent-dark:#4f46e5;
    --ink:#0f172a; --muted:#64748b; --line:#e6e9f0;
    --dot-blue:#60a5fa; --dot-purple:#a78bfa; --dot-yellow:#fbbf24;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Inter',Arial,sans-serif; color:var(--ink); }
  nav{ display:flex; align-items:center; justify-content:space-between; padding:16px 40px; border-bottom:1px solid var(--line); background:#fff; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .brand .logo{ width:34px; height:34px; border-radius:8px; background:linear-gradient(135deg,var(--accent),#8b5cf6); display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:13px; }
  .brand .name{ font-weight:800; font-size:15px; letter-spacing:.01em; }
  .navlinks{ display:flex; gap:30px; font-size:14px; font-weight:600; color:#334155; }
  .navlinks a{ color:inherit; text-decoration:none; }
  .navbtns{ display:flex; gap:10px; }
  .btn{ padding:8px 16px; border-radius:8px; font-weight:700; font-size:13px; text-decoration:none; display:inline-block; border:none; cursor:pointer; }
  .btn-outline{ border:1px solid var(--line); color:var(--ink); background:#fff; }
  .btn-fill{ background:var(--accent); color:#fff; border:1px solid var(--accent); }
  .btn-fill:hover{ background:var(--accent-dark); }

  .split{ display:flex; min-height:calc(100vh - 65px); }
  .left{ flex:1 1 50%; background:var(--navy); color:#fff; padding:56px; display:flex; flex-direction:column; justify-content:center; }
  .left h1{ font-size:34px; font-weight:800; line-height:1.2; margin:0 0 16px; }
  .left h1 .accent{ color:#a5b4fc; }
  .left p.desc{ color:#94a3b8; font-size:14.5px; line-height:1.65; max-width:460px; margin:0 0 26px; }
  .checklist{ display:flex; flex-direction:column; gap:10px; max-width:460px; margin-bottom:22px; }
  .checklist .item{ background:var(--card-dark); border-radius:9px; padding:12px 16px; display:flex; align-items:center; gap:12px; font-size:13.5px; font-weight:600; }
  .checklist .tick{ width:20px; height:20px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
  .feature-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:460px; }
  .feature-grid .f{ background:var(--card-dark); border-radius:9px; padding:12px 14px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .roles{ display:flex; flex-direction:column; gap:12px; max-width:460px; }
  .role-card{ background:var(--card-dark); border-radius:10px; padding:14px 16px; display:flex; align-items:flex-start; gap:12px; }
  .role-card .dot{ width:9px; height:9px; border-radius:50%; margin-top:6px; flex-shrink:0; }
  .role-card b{ font-size:14px; display:block; }
  .role-card span{ font-size:12.5px; color:#94a3b8; }
  .steps{ display:flex; flex-direction:column; gap:12px; max-width:460px; }
  .step{ background:var(--card-dark); border-radius:10px; padding:14px 16px; display:flex; align-items:center; gap:14px; font-size:13.5px; }
  .step .n{ width:26px; height:26px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0; }
  .footer-note{ margin-top:28px; font-size:11.5px; color:#475569; }

  .right{ flex:1 1 50%; background:#f4f6f9; display:flex; align-items:center; justify-content:center; padding:36px 24px; }
  .card{ background:#fff; border-radius:16px; box-shadow:0 10px 40px rgba(15,23,42,.08); padding:40px; width:100%; max-width:420px; }
  .card.wide{ max-width:560px; }
  .card h2{ margin:0 0 4px; font-size:22px; font-weight:800; color:var(--ink); }
  .card p.sub{ margin:0 0 24px; font-size:13px; color:var(--muted); line-height:1.5; }
  label{ display:flex; justify-content:space-between; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#475569; margin-bottom:6px; }
  label a{ text-transform:none; font-weight:600; color:var(--accent); text-decoration:none; letter-spacing:0; font-size:12px; }
  .field{ margin-bottom:16px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .row{ display:flex; gap:8px; }
  input, textarea{ width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:9px; font-family:inherit; font-size:14px; background:#f8fafc; }
  textarea{ resize:vertical; min-height:90px; }
  input:disabled{ background:#eef1f5; color:#94a3b8; }
  input:focus, textarea:focus{ outline:none; border-color:var(--accent); background:#fff; }
  .btn-block{ width:100%; padding:12px; font-size:14.5px; }
  .btn:disabled{ background:#c7cbe8; cursor:not-allowed; }
  .links{ text-align:center; margin-top:18px; font-size:13px; color:var(--muted); }
  .links a{ color:var(--accent); text-decoration:none; font-weight:600; }
  .trust-row{ text-align:center; margin-top:16px; font-size:12px; color:var(--muted); }
  .trust-row .dot-sep{ margin:0 6px; }
  .alert{ padding:10px 12px; border-radius:8px; font-size:12.5px; margin-bottom:14px; }
  .alert-error{ background:#fdeceb; color:#dc2626; }
  .alert-success{ background:#e5f8f1; color:#0f9d6a; }
  .hint{ font-size:11.5px; margin-top:5px; }
  .hint.ok{ color:#0f9d6a; } .hint.err{ color:#dc2626; }
  ul.errorlist{ list-style:none; margin:4px 0 0; padding:0; color:#dc2626; font-size:11.5px; }
  @media (max-width:860px){ .split{ flex-direction:column; } .left{ padding:36px 24px; } .right{ padding:36px 24px; } .navlinks{ display:none; } .form-grid{ grid-template-columns:1fr; } }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <a class="brand" href="{% url 'home' %}">
      <div class="logo">EP</div>
      <div class="name">EDGEPRO PAYROLL</div>
    </a>
    <div class="navlinks">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'home' %}#features">Features</a>
      <a href="{% url 'home' %}#about">About</a>
    </div>
    <div class="navbtns">
      <a class="btn btn-outline" href="{% url 'login' %}">Login</a>
      <a class="btn btn-fill" href="{% url 'employee_register' %}">Register</a>
    </div>
  </nav>
  <div class="split">
    <div class="left">
      {% block left %}{% endblock %}
    </div>
    <div class="right">
      <div class="card {% block cardsize %}{% endblock %}">
        {% if messages %}{% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">{{ message }}</div>
        {% endfor %}{% endif %}
        {% block right %}{% endblock %}
      </div>
    </div>
  </div>
{% block extra_body %}{% endblock %}
</body>
</html>
